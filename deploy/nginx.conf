map $http_user_agent $yohaku_certificate_disposition {
    default 'attachment; filename="yohaku.crt"';
    ~*(iphone|ipad|ipod|macintosh) '';
}

server {
    listen @HTTPS_PORT@ ssl;
    server_name @SITE_HOSTS@;
    ssl_certificate @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;

    # Publish only the exported public root certificate, never TLS private keys.
    # Safari recognizes this MIME type and offers to install the certificate.
    location = /yohaku.crt {
        alias /var/lib/yohaku/certificates/yohaku.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition $yohaku_certificate_disposition;
        add_header Cache-Control "no-store";
        limit_except GET { deny all; }
    }

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
